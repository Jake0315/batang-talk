<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batang (시연용)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Batang — 학생회 '바탕' 업무 메신저
 * 색·모서리·캐릭터는 바탕화면 웹앱과 맞추고, 화면 구조는 슬랙, 움직임은 토스식으로. */
:root{
  --sky:#F5FBFF; --mint:#96B8B6; --green:#668485; --green-deep:#4E6869;
  --ink:#213536; --sub:#5B7071; --faint:#97AAAA; --line:#DCE8E9;
  --card:#FFFFFF; --card2:#EEF6F7; --mint-soft:#E2EFEE;
  --good:#3F7A68; --warn:#B7791F; --warn-soft:#F7EDDB; --bad:#B4514C; --bad-soft:#F8E5E3;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --display:"Jua",var(--font);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,1.2,.4,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --sky:#101A1B; --mint:#5E8482; --green:#7FA3A2; --green-deep:#A9C9C7;
  --ink:#E6F0F0; --sub:#9DB3B3; --faint:#6C8384; --line:#243335;
  --card:#172425; --card2:#1D2C2E; --mint-soft:#213638;
  --warn:#E0A64B; --warn-soft:#3A2F1B; --bad:#E08882; --bad-soft:#3B2321;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--sky);color:var(--ink);overscroll-behavior:none}
body{font-family:var(--font);font-size:15.5px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--green-deep)}
svg{display:block}
[hidden]{display:none!important}

#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--sky)}
@media (min-width:560px){body{background:var(--mint-soft)}#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(33,53,54,.18)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--sky);
  transition:transform .28s var(--ease),filter .28s var(--ease);will-change:transform}
.screen.push{transform:translateX(100%);box-shadow:-12px 0 32px rgba(33,53,54,.10);visibility:hidden;transition:transform .28s var(--ease),visibility 0s .28s}
.screen.push.in{transform:none;visibility:visible;transition:transform .28s var(--ease)}
.screen.under{transform:translateX(-22%);filter:brightness(.94)}
.screen.drag{transition:none!important}

/* 상단 */
.top{display:flex;align-items:center;gap:4px;min-height:56px;padding:calc(6px + var(--safe-t)) 8px 6px;background:var(--sky);flex:none}
.top.line{box-shadow:0 1px 0 var(--line)}
.top .ttl{flex:1;min-width:0;padding:0 6px}
.top .ttl b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:12px;color:var(--sub);margin-top:-2px}
.brand{font-family:var(--display);font-size:26px;flex:1;padding:0 10px;color:var(--green-deep)}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink);flex:none;transition:transform .1s,background .1s}
.ib:active{background:var(--mint-soft);transform:scale(.94)}
.ib svg{width:23px;height:23px}
.ib.on{color:var(--green-deep);background:var(--mint-soft)}

/* 탭 */
.tabview{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 20px}
.tabbar{display:flex;flex:none;background:var(--card);box-shadow:0 -1px 0 var(--line);padding-bottom:var(--safe-b)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--faint);position:relative;transition:transform .1s}
.tabbar button:active{transform:scale(.94)}
.tabbar button.on{color:var(--green-deep)}
.tabbar svg{width:24px;height:24px}
.tabbar .dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;font-weight:700}
.h2{font-size:13px;font-weight:700;color:var(--sub);margin:18px 6px 8px}
.fade{animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 목록 카드 */
.list{background:var(--card);border-radius:18px;box-shadow:0 1px 2px rgba(33,53,54,.05),0 6px 18px rgba(52,86,88,.07);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;min-height:52px;transition:background .1s,transform .1s}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.row:active{background:var(--card2);transform:scale(.985)}
.row .ic{width:22px;height:22px;color:var(--faint);flex:none}
.row .nm{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.row.unread .nm{font-weight:700;color:var(--ink)}
.row.unread .ic{color:var(--green-deep)}
.row .mute{width:16px;height:16px;color:var(--faint)}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--mint-soft);color:var(--green-deep);font-size:12px;font-weight:700;line-height:22px;text-align:center}
.badge.hot{background:var(--bad);color:#fff}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 2px rgba(33,53,54,.05),0 6px 18px rgba(52,86,88,.07);padding:16px}
.item{display:block;width:100%;text-align:left;padding:13px 14px;transition:background .1s,transform .1s}
.item+.item{box-shadow:inset 0 1px 0 var(--line)}
.item:active{background:var(--card2);transform:scale(.985)}
.item .meta{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--sub)}
.item .meta b{color:var(--green-deep)}
.item .meta .pip{width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:auto}
.item .tx{font-size:15px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .ft{font-size:12.5px;color:var(--sub);margin-top:3px}
.empty{padding:36px 20px;text-align:center;color:var(--sub);font-size:14.5px}
.empty img{width:120px;display:block;margin:0 auto 10px}
.banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--mint-soft);border-radius:16px;padding:12px 14px;margin:6px 0 2px;transition:transform .1s}
.banner:active{transform:scale(.98)}
.banner img{width:44px;flex:none}
.banner b{display:block;font-size:14.5px}
.banner span{display:block;font-size:12.5px;color:var(--sub)}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-size:16px;font-weight:700;transition:transform .1s,box-shadow .1s,opacity .2s}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-deep)}
.btn.soft{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.btn.soft:active{background:var(--mint-soft);transform:scale(.98)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{height:40px;width:auto;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0}
.opt+.opt{box-shadow:inset 0 1px 0 var(--line)}
.opt .g{flex:1;min-width:0}
.opt b{display:block;font-size:15px}
.opt small{display:block;font-size:12.5px;color:var(--sub)}

/* 로그인 */
.auth{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:6px}
.auth img{width:150px}
.auth h1{font-family:var(--display);font-weight:400;font-size:34px;margin:8px 0 0;color:var(--green-deep)}
.auth p{color:var(--sub);margin:0 0 22px}
.auth .btn{max-width:320px}
.auth .gg{width:20px;height:20px}

/* 대화 */
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 10px;overflow-anchor:none}
.day{display:flex;align-items:center;gap:10px;margin:14px 14px 6px;font-size:12px;font-weight:600;color:var(--sub)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.newline{display:flex;align-items:center;gap:8px;margin:8px 14px;font-size:11.5px;font-weight:700;color:var(--bad)}
.newline::before,.newline::after{content:"";flex:1;height:1px;background:var(--bad);opacity:.5}
.msg{display:grid;grid-template-columns:38px 1fr auto;gap:0 10px;padding:7px 12px 3px 14px;position:relative;transition:background .15s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.msg.cont{padding-top:2px}
.msg:active,.msg.hold{background:var(--card2)}
.msg.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{background:var(--warn-soft)}100%{background:transparent}}
.msg.new{animation:fade .18s var(--ease)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:20px;height:20px;border-radius:6px;font-size:10px}
.mh{display:flex;align-items:baseline;gap:6px}
.mh b{font-size:15px;font-weight:700}
.mh time{font-size:11.5px;color:var(--faint)}
.mh .tag{font-size:11px;color:var(--sub);background:var(--mint-soft);border-radius:6px;padding:0 6px}
.mt{font-size:15.5px;white-space:pre-wrap}
.mt.del{color:var(--faint);font-style:italic}
.mt .ed{font-size:11.5px;color:var(--faint);margin-left:4px}
.mt .mn{background:var(--mint-soft);color:var(--green-deep);border-radius:5px;padding:0 3px;font-weight:600}
.mt .mn.me{background:var(--warn-soft);color:var(--warn)}
.mt mark{background:#FFE58A;color:inherit;border-radius:3px}
.mr{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;min-width:16px;padding-bottom:3px}
.un{font-size:11.5px;font-weight:700;color:var(--warn);display:inline-block;animation:tick .2s var(--ease)}
@keyframes tick{from{transform:translateY(5px);opacity:0}}
.more{position:absolute;right:8px;top:2px;width:30px;height:26px;border-radius:8px;background:var(--card);box-shadow:0 0 0 1px var(--line);display:none;place-items:center;color:var(--sub)}
.more svg{width:18px;height:18px}
@media (hover:hover){.msg:hover{background:var(--card2)}.msg:hover .more{display:grid}}
.rx{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rx button{display:flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:13px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;color:var(--sub);transition:transform .1s}
.rx button:active{transform:scale(.9)}
.rx button.on{background:var(--mint-soft);box-shadow:inset 0 0 0 1.5px var(--mint);color:var(--green-deep)}
.thr{display:flex;align-items:center;gap:6px;margin-top:6px;padding:5px 8px 5px 5px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--sub);transition:transform .1s;max-width:100%}
.thr:active{transform:scale(.97)}
.thr b{color:var(--green-deep);font-weight:700}
.thr .avs{display:flex;gap:3px}
.thr svg{width:14px;height:14px;color:var(--faint)}
.att{margin-top:6px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.att-img{display:block;width:220px;max-width:100%;aspect-ratio:4/3;border-radius:14px;background:var(--card2) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;transition:transform .1s}
.att-img:active,.att-file:active{transform:scale(.97)}
.att-img.sk,.sk{background:linear-gradient(90deg,var(--card2) 0,var(--card) 50%,var(--card2) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.att-file{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 9px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);max-width:100%;text-align:left;transition:transform .1s}
.ext{width:38px;height:44px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:800;flex:none}
.att-file b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.att-file small{display:block;font-size:12px;color:var(--sub)}
.skrow{display:flex;gap:10px;padding:10px 14px}
.skrow i{display:block;border-radius:10px}
.loadmore{display:block;margin:6px auto;font-size:13px;color:var(--green-deep);font-weight:600;padding:8px 14px}
.thead{margin:4px 14px 2px;font-size:12.5px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:10px}
.thead::after{content:"";flex:1;height:1px;background:var(--line)}

/* 입력창 */
.comp{flex:none;background:var(--card);box-shadow:0 -1px 0 var(--line);padding:8px 8px calc(8px + var(--safe-b))}
.comp .bar{display:flex;align-items:flex-end;gap:4px}
.comp textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:var(--card2);border-radius:18px;padding:9px 14px;font-size:16px;line-height:1.4;max-height:120px}
.comp textarea::placeholder{color:var(--faint)}
.send{width:40px;height:40px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;transition:transform .1s,opacity .2s}
.send:active{transform:scale(.9)}
.send[disabled]{opacity:.4}
.send svg{width:20px;height:20px}
.send.busy svg{display:none}
.send.busy::after{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ctx{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding:2px 6px 8px}
.ctx span{flex:1}
.ctx button{color:var(--green-deep);font-weight:700}
.pend{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 8px}
.pend span{display:flex;align-items:center;gap:6px;background:var(--mint-soft);border-radius:10px;padding:5px 6px 5px 10px;font-size:13px;max-width:100%}
.pend span i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.pend button{width:20px;height:20px;border-radius:50%;background:var(--card);font-size:12px;line-height:20px}
.also{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--sub);padding:0 6px 8px}
.also i{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:#fff;transition:all .12s}
.also.on i{background:var(--green);box-shadow:none}
.also svg{width:14px;height:14px}
.mlist{max-height:176px;overflow-y:auto;margin:0 0 8px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.mlist button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;text-align:left;font-size:14.5px}
.mlist button:active{background:var(--card2)}
.ro{padding:14px 16px calc(14px + var(--safe-b));text-align:center;font-size:13.5px;color:var(--sub);background:var(--card);box-shadow:0 -1px 0 var(--line)}

/* 시트 */
.scrim{position:absolute;inset:0;background:rgba(22,38,39,.45);z-index:40;animation:dim .2s ease}
@keyframes dim{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + var(--safe-b));max-height:88%;overflow-y:auto;animation:up .32s var(--spring)}
@keyframes up{from{transform:translateY(100%)}}
.sheet.out{transition:transform .2s ease-in;transform:translateY(100%)}
.scrim.out{transition:opacity .2s;opacity:0}
.sheet.tall{height:88%;display:flex;flex-direction:column}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:17px;margin:2px 2px 10px}
.emo{display:flex;justify-content:space-between;margin:2px 0 10px}
.emo button{width:46px;height:46px;border-radius:50%;background:var(--card2);font-size:22px;transition:transform .12s var(--spring)}
.emo button:active{transform:scale(1.25)}
.emo button.on{background:var(--mint-soft);box-shadow:inset 0 0 0 2px var(--mint)}
.act{display:flex;align-items:center;gap:12px;width:100%;padding:13px 6px;font-size:16px;text-align:left;border-radius:12px;transition:background .1s,transform .1s}
.act:active{background:var(--card2);transform:scale(.98)}
.act svg{width:22px;height:22px;color:var(--sub)}
.act.danger,.act.danger svg{color:var(--bad)}
.who{display:flex;align-items:center;gap:10px;padding:9px 2px}
.who>span:not(.av){flex:1}
.who em{font-style:normal;font-size:13px;color:var(--good);font-weight:600}
.who em.no{color:var(--warn)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:14px;padding:0 12px;height:46px;flex:none}
.sbox svg{width:20px;height:20px;color:var(--faint)}
.sbox input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.sres{flex:1;overflow-y:auto;margin-top:8px}
.pv{flex:1;border-radius:16px;overflow:hidden;background:var(--card2);display:grid;place-items:center;min-height:240px}
.pv img{max-width:100%;max-height:100%;object-fit:contain}
.pv iframe{width:100%;height:100%;border:0;background:#fff}
.pv .fake{padding:24px;text-align:center;color:var(--sub);font-size:14px}
.pv .slide{width:240px;aspect-ratio:16/9;background:#fff;color:#213536;border-radius:8px;display:grid;place-items:center;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.12);margin:0 auto 12px}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 0;font-size:15px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--mint-soft);color:var(--green-deep);font-weight:700;display:grid;place-items:center;flex:none;font-size:13.5px}
.toast{position:absolute;left:50%;bottom:calc(86px + var(--safe-b));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--sky);padding:11px 16px;border-radius:14px;font-size:14.5px;max-width:calc(100% - 40px);width:max-content;text-align:center;z-index:60;transition:all .25s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.demo-tag{position:absolute;top:calc(8px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:90;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;pointer-events:none;opacity:.9}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="scr-auth"></section>
  <section class="screen" id="scr-main" hidden><div class="tabview" id="tabview"></div><nav class="tabbar" id="tabbar"></nav></section>
  <section class="screen push" id="scr-channel"></section>
  <section class="screen push" id="scr-thread"></section>
  <div id="sheet-root"></div>
  <div class="toast" id="toast"></div>

  el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1700);
}

/* ───────── 입력창 ───────── */
function compHTML(kind) {
  var c = kind === 'ch' ? chan(S.ch.id) : null;
  if (kind === 'ch' && c && c.post_policy === 'staff' && !isStaff()) return '<div class="ro">운영진만 글을 쓸 수 있어요. 메시지를 눌러 스레드로 답할 수 있어요.</div>';
  return '<div class="comp" id="comp-' + kind + '"><div id="cx-' + kind + '"></div><div class="bar">' +
    '<button class="ib" data-act="attach" data-kind="' + kind + '" aria-label="파일 첨부">' + I.plus + '</button>' +
    '<textarea id="ta-' + kind + '" rows="1" placeholder="' + (kind === 'th' ? '답글 쓰기' : '메시지 쓰기') + '" data-kind="' + kind + '"></textarea>' +
    '<button class="send" id="send-' + kind + '" data-act="send" data-kind="' + kind + '" aria-label="보내기">' + I.send + '</button></div>' +
    '<input type="file" id="file-' + kind + '" multiple hidden data-kind="' + kind + '"></div>';
}
function renderCtx(kind) {
  var ctx = kind === 'th' ? S.th : S.ch, el = $('#cx-' + kind); if (!el || !ctx) return;
  var h = '';
  if (ctx.mq != null) {
    var list = mentionCandidates(kind, ctx.mq);
    if (list.length) h += '<div class="mlist">' + list.map(function (u) { return '<button data-act="pick" data-kind="' + kind + '" data-n="' + esc(u.name) + '">' + (u.id ? av(u.id, 's') : '<span class="av s" style="background:var(--warn)">@</span>') + esc(u.name) + (u.id ? '' : ' <small style="color:var(--sub)">채널 전원에게 알림</small>') + '</button>'; }).join('') + '</div>';
  }
  if (ctx.edit) h += '<div class="ctx"><span>메시지 수정 중</span><button data-act="cancelEdit" data-kind="' + kind + '">취소</button></div>';
  if (ctx.pending.length) h += '<div class="pend">' + ctx.pending.map(function (f, i) { return '<span><i>' + esc(f.name) + '</i><button data-act="unfile" data-kind="' + kind + '" data-i="' + i + '" aria-label="빼기">✕</button></span>'; }).join('') + '</div>';
  if (kind === 'th' && !ctx.edit && canAlso()) h += '<button class="also' + (ctx.also ? ' on' : '') + '" data-act="also"><i>' + I.check + '</i>채널에도 보내기</button>';
  el.innerHTML = h;
  var sb = $('#send-' + kind); if (sb) { sb.classList.toggle('busy', !!ctx.sending); sb.disabled = !!ctx.sending; }
}
function canAlso() { var c = S.th && S.th.root && chan(S.th.root.channel_id); return c && (c.post_policy === 'all' || isStaff()); }
function mentionCandidates(kind, q) {
  var cm = (kind === 'th' ? S.th.cm : S.ch.cm) || [];
  var l = cm.map(function (r) { return S.members[r.member_id]; }).filter(function (u) { return u && u.id !== S.me.id && u.name.indexOf(q) >= 0; });
  if (isStaff() && '채널'.indexOf(q) >= 0) l.unshift({ id: null, name: '채널' });
  return l.slice(0, 8);
}
function onInput(ta) {
  var kind = ta.dataset.kind, ctx = kind === 'th' ? S.th : S.ch;
  ta.style.height = 'auto'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px';
  var m = ta.value.slice(0, ta.selectionStart).match(/@([^\s@]*)$/), mq = m ? m[1] : null;
  if (mq !== ctx.mq) { ctx.mq = mq; renderCtx(kind); }
}
function parseMentions(body, cm) {
  var ids = [];
  (cm || []).forEach(function (r) { var u = S.members[r.member_id]; if (u && u.id !== S.me.id && body.indexOf('@' + u.name) >= 0) ids.push(u.id); });
  return { ids: ids, all: isStaff() && body.indexOf('@채널') >= 0 };
}
function send(kind) {
  var ctx = kind === 'th' ? S.th : S.ch, ta = $('#ta-' + kind), body = ta.value.trim();
  if (!ctx || ctx.sending || (!body && !ctx.pending.length)) return;
  ctx.sending = true; ctx.mq = null; renderCtx(kind);
  var done = function () { ctx.sending = false; renderCtx(kind); };
  if (ctx.edit) {
    if (!body) { done(); return toast('내용을 입력해 주세요'); }
    return B.edit(ctx.edit, body).then(function (m) { ctx.edit = null; ta.value = ''; onInput(ta); upsertMsg(m); }).catch(fail).then(done);
  }
  var channel = kind === 'th' ? S.th.root.channel_id : S.ch.id, files = [], chain = Promise.resolve();
  ctx.pending.forEach(function (f) { chain = chain.then(function () { return B.upload(f, channel); }).then(function (a) { files.push(a); }); });
  var men = parseMentions(body, ctx.cm);
  chain.then(function () {
    return B.send({ channel_id: channel, body: body, parent_id: kind === 'th' ? S.th.id : null, also_to_channel: kind === 'th' && !!ctx.also, mention_ids: men.ids, mention_all: men.all, files: files });
  }).then(function (m) {
    ta.value = ''; ctx.pending = []; ctx.also = false; onInput(ta); ctx.justAdded = m.id; upsertMsg(m, true);
  }).catch(function (e) { if (files.length || ctx.pending.length) e.userMessage = e.userMessage || '파일을 올리지 못했어요'; fail(e); }).then(done);
}

/* ───────── 채널 ───────── */
function openChannel(id, focus) {
  var c = chan(id);
  S.ch = { id: id, msgs: [], cm: [], loading: true, more: false, pending: [], edit: null, newFrom: c ? ts(c.last_read_at) : 0, focus: focus, hl: null };
  $('#scr-channel').innerHTML = '<div class="top line"><button class="ib" data-act="back" aria-label="뒤로">' + I.back + '</button><div class="ttl"><b>' + (c ? esc(c.name) : '') + '</b><small>' + (c ? '구성원 ' + c.member_count + '명' : '') + '</small></div>' +
    '<button class="ib" data-act="search" data-c="' + id + '" aria-label="검색">' + I.search + '</button><button class="ib" data-act="notif" aria-label="알림 설정">' + (c && c.notify === 'mentions' ? I.bellOff : I.bell) + '</button></div>' +
    '<div class="msgs" id="list-ch">' + skel(6) + '</div>' + (c ? compHTML('ch') : '');
  if (!c) { S.ch.loading = false; $('#list-ch').innerHTML = '<div class="empty"><img src="' + B.img('taang_sorry') + '" alt="">볼 수 없는 채널이에요.</div>'; return; }
  Promise.all([B.listMessages(id), B.channelMembers(id)]).then(function (d) {
    if (!S.ch || S.ch.id !== id) return;
    S.ch.msgs = d[0]; S.ch.cm = d[1]; S.ch.loading = false; S.ch.more = d[0].length >= 50;
    if (S.th && S.th.root && S.th.root.channel_id === id) S.th.cm = d[1];
    renderMsgs('ch', { bottom: true }); renderCtx('ch'); markRead();
  }).catch(fail);
}
var mrT;
function markRead() {
  if (!S.ch || S.ch.loading || document.hidden || S.route.t) return;
  var id = S.ch.id; clearTimeout(mrT);
  mrT = setTimeout(function () {
    var c = chan(id); if (c) { c.unread = 0; c.mentions = 0; }
    var mine = S.ch && S.ch.id === id && S.ch.cm.filter(function (r) { return r.member_id === S.me.id; })[0];
    if (mine) mine.last_read_at = new Date().toISOString();
    B.markRead(id).catch(function () {});
  }, 400);
}
function upsertInto(arr, m) {
  for (var i = 0; i < arr.length; i++) if (arr[i].id === m.id) { arr[i] = m; return false; }
  arr.push(m); arr.sort(function (a, b) { return ts(a.created_at) - ts(b.created_at); }); return true;
}
function upsertMsg(m, mine) {
  if (!m) return;
  if (S.ch && !S.ch.loading && m.channel_id === S.ch.id && (!m.parent_id || m.also_to_channel)) {
    var added = upsertInto(S.ch.msgs, m);
    if (added && !mine && m.sender_id !== S.me.id) S.ch.justAdded = m.id;
    renderMsgs('ch', { bottom: mine });
    if (added && m.sender_id !== S.me.id) markRead();
  }
  if (S.th && !S.th.loading && (m.id === S.th.id || m.parent_id === S.th.id)) {
    if (m.id === S.th.id) { S.th.root = m; S.th.msgs[0] = m; } else {
      var add2 = upsertInto(S.th.msgs, m);
      if (add2 && m.sender_id !== S.me.id) { S.th.justAdded = m.id; B.markThreadRead(S.th.id).catch(function () {}); }
    }
    renderMsgs('th', { bottom: mine });
  }
  refreshOverview();
}
function onRead(r) {
  var patch = function (cm) { (cm || []).forEach(function (x) { if (x.member_id === r.member_id) x.last_read_at = r.last_read_at; }); };
  if (S.ch && S.ch.id === r.channel_id) { patch(S.ch.cm); renderMsgs('ch'); }
  if (S.th && S.th.root && S.th.root.channel_id === r.channel_id) { if (!S.ch || S.th.cm !== S.ch.cm) patch(S.th.cm); renderMsgs('th'); }
}
function onThreadRead(r) {
  if (!S.th || r.root_id !== S.th.id) return;
  var f = S.th.reads.filter(function (x) { return x.member_id === r.member_id; })[0];
  if (f) { f.last_read_at = r.last_read_at; f.following = r.following; } else S.th.reads.push(r);
  renderMsgs('th'); renderThreadTop();
}

/* ───────── 스레드 ───────── */
function openThread(id, focus) {
  S.th = { id: id, msgs: [], reads: [], cm: [], loading: true, pending: [], edit: null, also: false, focus: focus, newFrom: 0 };
  $('#scr-thread').innerHTML = '<div class="top line" id="th-top"></div><div class="msgs" id="list-th">' + skel(4) + '</div>' + compHTML('th');
  renderThreadTop();
  B.listThread(id).then(function (d) {
    if (!S.th || S.th.id !== id) return;
    if (!d.root) { S.th.loading = false; $('#list-th').innerHTML = '<div class="empty"><img src="' + B.img('taang_sorry') + '" alt="">볼 수 없는 스레드예요.</div>'; return; }
    S.th.root = d.root; S.th.msgs = [d.root].concat(d.replies); S.th.reads = d.reads; S.th.loading = false;
    var mine = d.reads.filter(function (r) { return r.member_id === S.me.id; })[0];
    S.th.newFrom = mine ? ts(mine.last_read_at) : 0;
    var useCh = S.ch && S.ch.id === d.root.channel_id && !S.ch.loading;
    return (useCh ? Promise.resolve(S.ch.cm) : B.channelMembers(d.root.channel_id)).then(function (cm) {
      if (!S.th || S.th.id !== id) return;
      S.th.cm = cm; renderThreadTop(); renderMsgs('th', { bottom: !S.th.focus }); renderCtx('th');
      B.markThreadRead(id).then(refreshOverview).catch(function () {});
    });
  }).catch(fail);
}
function renderThreadTop() {
  var el = $('#th-top'); if (!el || !S.th) return;
  var c = S.th.root && chan(S.th.root.channel_id);
  var mine = S.th.reads.filter(function (r) { return r.member_id === S.me.id; })[0], fol = !!(mine && mine.following);
  el.innerHTML = '<button class="ib" data-act="back" aria-label="뒤로">' + I.back + '</button><div class="ttl"><b>스레드</b><small>' + (c ? esc(c.name) : '') + '</small></div>' +
    (S.th.root ? '<button class="ib' + (fol ? ' on' : '') + '" data-act="follow" aria-label="스레드 알림">' + (fol ? I.bell : I.bellOff) + '</button>' : '');
}

/* ───────── 시트 ───────── */
function openSheet(html, cls) {

}
function closeSheet(now) {

}

  (m.reactions || []).forEach(function (r) { if (r.member_id === S.me.id) my[r.emoji] = 1; });
  var a = function (act, icon, label, cls) { return '<button class="act ' + (cls || '') + '" data-act="' + act + '" data-m="' + id + '" data-kind="' + kind + '">' + icon + label + '</button>'; };
  openSheet('<div class="emo">' + EMOJI.map(function (e) { return '<button class="' + (my[e] ? 'on' : '') + '" data-act="react" data-m="' + id + '" data-e="' + e + '">' + e + '</button>'; }).join('') + '</div>' +
    (kind === 'ch' ? a('thread', I.reply, '스레드에서 답글 달기') : '') + (m.body ? a('copy', I.copy, '복사') : '') + a('readers', I.eye, '읽음 확인') +
    (mine && m.body ? a('edit', I.edit, '수정') : '') + (mine || S.me.role === 'admin' ? a('del', I.trash, '삭제', 'danger') : ''));
}
function readersSheet(id, kind) {
  var m = findMsg(id); if (!m) return;
  var t = ts(m.created_at), rows;
  if (kind === 'th' && m.parent_id) rows = S.th.reads.filter(function (r) { return r.following; });
  else rows = (kind === 'th' ? S.th.cm : S.ch.cm) || [];
  rows = rows.filter(function (r) { return r.member_id !== m.sender_id; });
  var n = rows.filter(function (r) { return ts(r.last_read_at) >= t; }).length;
  openSheet('<h3>읽음 ' + n + ' · 안 읽음 ' + (rows.length - n) + '</h3>' + (kind === 'th' && m.parent_id ? '<div style="font-size:12.5px;color:var(--sub);margin:-6px 2px 8px">스레드 참여자 기준이에요</div>' : '') +
    rows.map(function (r) { var ok = ts(r.last_read_at) >= t; return '<div class="who">' + av(r.member_id, 's') + '<span>' + esc(name(r.member_id)) + '</span><em class="' + (ok ? '' : 'no') + '">' + (ok ? '읽음' : '안 읽음') + '</em></div>'; }).join(''));
}
function notifSheet() {

  openSheet('<h3>' + esc(c.name) + ' 알림</h3><div class="opt"><div class="g"><b>모든 메시지 알림</b><small>끄면 나를 멘션했을 때만 알려요</small></div><button class="toggle' + (c.notify === 'all' ? ' on' : '') + '" data-act="setNotify" aria-label="모든 메시지 알림"></button></div>' +
    '<div class="opt"><div class="g"><b>멘션은 항상 알림</b><small>@' + esc(S.me.name) + ' · @채널</small></div><button class="toggle on" disabled style="opacity:.5" aria-label="항상 켜짐"></button></div>');

    (isIOS() ? '<li>사파리로 이 주소를 열어요.</li><li>아래 가운데 <b>공유 버튼</b>(네모에 화살표)을 눌러요.</li><li><b>홈 화면에 추가</b>를 눌러요.</li><li>홈 화면의 Batang을 열고 알림을 켜요.</li>'
             : '<li>크롬 오른쪽 위 <b>⋮</b> 메뉴를 눌러요.</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 눌러요.</li><li>홈 화면의 Batang을 열고 알림을 켜요.</li>') + '</ol>');

var srT, srScope = null;

      }).join('') : '<div class="empty"><img src="' + B.img('taang_thinking') + '" alt="">찾는 메시지가 없어요.</div>';
    }).catch(fail);

}

/* ───────── 누르기 ───────── */

  back: back, closeSheet: function () { closeSheet(); },
  link: function () {},
  msg: function (el) { if (el.dataset.kind === 'ch') ACT.thread({ dataset: { m: el.dataset.id } }); else msgSheet(el.dataset.id, 'th'); },
  sheet: function (el) { msgSheet(el.dataset.m, el.dataset.kind); },
  thread: function (el) { var m = findMsg(el.dataset.m); if (!m) return; closeSheet(true); go('#/c/' + m.channel_id + '/t/' + (m.parent_id || m.id)); },

  cancelEdit: function (el) { var k = el.dataset.kind, ctx = k === 'th' ? S.th : S.ch, ta = $('#ta-' + k); ctx.edit = null; ta.value = ''; onInput(ta); renderCtx(k); },
  del: function (el) {
    var id = el.dataset.m;
    openSheet('<h3>이 메시지를 삭제할까요?</h3><div style="color:var(--sub);font-size:14px;margin:-4px 2px 14px">삭제하면 되돌릴 수 없고, 백업에서도 지워져요.</div><div style="display:flex;gap:8px"><button class="btn soft" data-act="closeSheet">취소</button><button class="btn danger" data-act="delYes" data-m="' + id + '">삭제</button></div>');
  },
  delYes: function (el) { closeSheet(); B.remove(el.dataset.m).then(function (m) { upsertMsg(m); toast('삭제했어요'); }).catch(fail); },
  react: function (el) {

  attach: function (el) { $('#file-' + el.dataset.kind).click(); },
  unfile: function (el) { var ctx = el.dataset.kind === 'th' ? S.th : S.ch; ctx.pending.splice(+el.dataset.i, 1); renderCtx(el.dataset.kind); },
  also: function () { S.th.also = !S.th.also; renderCtx('th'); },
  pick: function (el) {
    var k = el.dataset.kind, ta = $('#ta-' + k), ctx = k === 'th' ? S.th : S.ch, pos = ta.selectionStart;
    var before = ta.value.slice(0, pos).replace(/@([^\s@]*)$/, '@' + el.dataset.n + ' ');
    ta.value = before + ta.value.slice(pos); ctx.mq = null; renderCtx(k); ta.focus(); ta.selectionStart = ta.selectionEnd = before.length;
  },
  send: function (el) { send(el.dataset.kind); },
  notif: notifSheet,
  setNotify: function (el) {
    var c = chan(S.ch.id), mode = c.notify === 'all' ? 'mentions' : 'all'; c.notify = mode; el.classList.toggle('on', mode === 'all');
    $('#scr-channel [data-act="notif"]').innerHTML = mode === 'all' ? I.bell : I.bellOff;
    B.setNotify(c.id, mode).then(function () { toast(mode === 'all' ? '모든 메시지를 알려요' : '멘션만 알려요'); }).catch(fail);
  },
  follow: function () {
    var mine = S.th.reads.filter(function (r) { return r.member_id === S.me.id; })[0], on = !(mine && mine.following);
    if (mine) mine.following = on; else S.th.reads.push({ member_id: S.me.id, root_id: S.th.id, last_read_at: new Date().toISOString(), following: on });
    renderThreadTop(); B.setFollow(S.th.id, on).then(function () { toast(on ? '이 스레드의 새 답글을 알려요' : '이 스레드 알림을 껐어요'); }).catch(fail);
  },
  search: function (el) { searchSheet(el.dataset.c); },
  hit: function (el) {
    var c = el.dataset.c, t = el.dataset.t, id = el.dataset.id; closeSheet(true);
    if (!t && S.ch && S.ch.id === c && !S.route.t) { S.ch.hl = el.dataset.q || null; renderMsgs('ch'); return focusMsg('ch', id); }
    S.focus = id || null; go('#/c/' + c + (t ? '/t/' + t : ''));
  },
  quiet: function (el) { S.me.quiet = !S.me.quiet; el.classList.toggle('on', S.me.quiet); B.setQuiet(S.me.quiet).catch(fail); },
  install: installSheet,
  pushOn: function () { B.enablePush().then(function (p) { S.push = p; renderTab(); toast(p.subscribed ? '알림을 켰어요' : '알림을 켜지 못했어요'); if (p.subscribed) B.testPush().catch(function () {}); }).catch(function (e) { e.userMessage = '알림을 켜지 못했어요'; fail(e); }); },
  pushTest: function () { B.testPush().then(function () { toast('테스트 알림을 보냈어요'); }).catch(fail); }
};
var holdT, held = false;
document.addEventListener('click', function (e) {
  if (held) { held = false; e.preventDefault(); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'msg' && window.getSelection && String(window.getSelection())) return;
  var f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('pointerdown', function (e) {
  var el = e.target.closest('.msg'); if (!el || e.target.closest('button,a')) return;
  clearTimeout(holdT);
  holdT = setTimeout(function () { held = true; el.classList.add('hold'); setTimeout(function () { el.classList.remove('hold'); }, 300); if (navigator.vibrate) navigator.vibrate(8); msgSheet(el.dataset.id, el.dataset.kind); setTimeout(function () { held = false; }, 700); }, 450);
});
['pointerup', 'pointercancel', 'pointermove', 'scroll'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { if (ev !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 6) clearTimeout(holdT); }, true);
});
document.addEventListener('contextmenu', function (e) { var el = e.target.closest('.msg'); if (el) { e.preventDefault(); clearTimeout(holdT); msgSheet(el.dataset.id, el.dataset.kind); } });
document.addEventListener('input', function (e) {
  if (e.target.tagName === 'TEXTAREA') onInput(e.target);
  if (e.target.id === 'sq') doSearch(e.target.value);
});
document.addEventListener('keydown', function (e) {
  if (e.target.tagName !== 'TEXTAREA' || e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  if (window.matchMedia('(pointer: coarse)').matches) return;   // 휴대폰에서는 Enter가 줄바꿈
  e.preventDefault(); send(e.target.dataset.kind);
});
document.addEventListener('change', function (e) {
  if (e.target.type !== 'file') return;
  var kind = e.target.dataset.kind, ctx = kind === 'th' ? S.th : S.ch;
  Array.prototype.forEach.call(e.target.files, function (f) { if (f.size > MAX_FILE) toast('25MB보다 큰 파일은 올릴 수 없어요'); else if (ctx.pending.length < 5) ctx.pending.push(f); });
  e.target.value = ''; renderCtx(kind);
});
/* 왼쪽 끝에서 밀어 뒤로 가기 */
var sw = null;
document.addEventListener('touchstart', function (e) {
  var t = e.touches[0], scr = S.route.t ? $('#scr-thread') : S.route.c ? $('#scr-channel') : null;
  if (!scr || t.clientX - $('#app').getBoundingClientRect().left > 24 || $('#sheet-root').firstChild) return;
  sw = { x: t.clientX, y: t.clientY, scr: scr, dx: 0, on: false };
}, { passive: true });
document.addEventListener('touchmove', function (e) {
  if (!sw) return; var t = e.touches[0]; sw.dx = t.clientX - sw.x;
  if (!sw.on) { if (Math.abs(t.clientY - sw.y) > 12) { sw = null; return; } if (sw.dx < 10) return; sw.on = true; sw.scr.classList.add('drag'); }
  sw.scr.style.transform = 'translateX(' + Math.max(0, sw.dx) + 'px)';
}, { passive: true });
document.addEventListener('touchend', function () {
  if (!sw) return; var s = sw; sw = null; if (!s.on) return;
  s.scr.classList.remove('drag'); s.scr.style.transform = '';
  if (s.dx > s.scr.clientWidth * 0.33) back();
});
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', function () {
  if (document.hidden || !S.me) return;
  refreshOverview();
  if (S.ch && !S.ch.loading) B.listMessages(S.ch.id).then(function (rows) {
    if (!S.ch) return; rows.forEach(function (m) { upsertInto(S.ch.msgs, m); }); renderMsgs('ch'); markRead();
  }).catch(function () {});
  if (S.th && !S.th.loading) B.listThread(S.th.id).then(function (d) { if (!S.th || !d.root) return; S.th.root = d.root; S.th.msgs = [d.root].concat(d.replies); S.th.reads = d.reads; renderMsgs('th'); }).catch(function () {});
});
window.BATANG_BOOT = boot;
boot();
})();
