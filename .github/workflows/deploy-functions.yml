name: deploy-functions

# main의 supabase/functions/ 가 바뀌면 푸시 알림 함수를 다시 배포해요.
# 함수의 비밀 값(VAPID 키, 웹훅 비밀번호)은 처음 한 번 Supabase에 넣은 그대로 유지돼요.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: push 함수 배포
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "SUPABASE_ACCESS_TOKEN 또는 SUPABASE_PROJECT_REF가 없어요"; exit 1; fi
          supabase functions deploy push --no-verify-jwt --project-ref "$PROJECT_REF" --yes
